name: Setup Ubuntu
description: Installs Ubuntu dependencies
inputs:
  gcc-ppa:
    description: Should this action install GCC from the ubuntu-toolchain-r/test PPA ("true" or "false")
    required: false
    default: "false"

  gcc-version:
    description: Version of GCC to install/use
    required: false
    default: "13"

  clang-version:
    description: Version of Clang to install/use
    required: false
    default: "18"

  compiler:
    description: Which compiler to use; should be one of "gcc" or "clang"
    required: true

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
      run: |
        case "$COMPILER" in
          gcc|clang) ;;
          *) echo "::error::Input 'compiler' must be 'gcc' or 'clang', got '$COMPILER'"; exit 1 ;;
        esac

    - name: Install GCC
      if: ${{ inputs.gcc-ppa == 'true' }}
      shell: bash
      env:
        GCC_VERSION: ${{ inputs.gcc-version }}
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get install -y "gcc-${GCC_VERSION}" "g++-${GCC_VERSION}"

    - name: Set up GCC
      shell: bash
      env:
        GCC_VERSION: ${{ inputs.gcc-version }}
      run: |
        for tool in g++ gcc gcov; do
          sudo update-alternatives --install "/usr/bin/${tool}" "${tool}" "/usr/bin/${tool}-${GCC_VERSION}" "${GCC_VERSION}0"
          sudo update-alternatives --set "${tool}" "/usr/bin/${tool}-${GCC_VERSION}"
        done

    - name: Set up GCC as c++/cc
      if: ${{ inputs.compiler == 'gcc' }}
      shell: bash
      env:
        GCC_VERSION: ${{ inputs.gcc-version }}
      run: |
        sudo update-alternatives --install /usr/bin/c++ c++ "/usr/bin/g++-${GCC_VERSION}" "${GCC_VERSION}0"
        sudo update-alternatives --install /usr/bin/cc cc "/usr/bin/gcc-${GCC_VERSION}" "${GCC_VERSION}0"

        sudo update-alternatives --set c++ "/usr/bin/g++-${GCC_VERSION}"
        sudo update-alternatives --set cc "/usr/bin/gcc-${GCC_VERSION}"

    - name: Install Clang
      if: ${{ inputs.compiler == 'clang' }}
      shell: bash
      env:
        CLANG_VERSION: ${{ inputs.clang-version }}
      run: |
        wget -q -O "${RUNNER_TEMP}/llvm.sh" https://apt.llvm.org/llvm.sh
        chmod +x "${RUNNER_TEMP}/llvm.sh"
        sudo "${RUNNER_TEMP}/llvm.sh" "${CLANG_VERSION}" all

        sudo update-alternatives --install /usr/bin/clang++ clang++ "/usr/bin/clang++-${CLANG_VERSION}" "${CLANG_VERSION}0"
        sudo update-alternatives --install /usr/bin/clang clang "/usr/bin/clang-${CLANG_VERSION}" "${CLANG_VERSION}0"

        sudo update-alternatives --install /usr/bin/c++ c++ "/usr/bin/clang++-${CLANG_VERSION}" "${CLANG_VERSION}0"
        sudo update-alternatives --install /usr/bin/cc cc "/usr/bin/clang-${CLANG_VERSION}" "${CLANG_VERSION}0"

        sudo update-alternatives --set clang++ "/usr/bin/clang++-${CLANG_VERSION}"
        sudo update-alternatives --set clang "/usr/bin/clang-${CLANG_VERSION}"

        sudo update-alternatives --set c++ "/usr/bin/clang++-${CLANG_VERSION}"
        sudo update-alternatives --set cc "/usr/bin/clang-${CLANG_VERSION}"

    - name: Check C++ binary
      shell: bash
      run: |
        realpath "$(command -v c++)"
        c++ --version

    - name: Install Ninja
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
